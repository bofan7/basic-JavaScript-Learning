<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>彻底搞懂自定义构造函数</title>
</head>

<body>
  <script>
    // =================================================================
    // 🧠 核心概念先导（通俗核心）：
    // 1. 构造函数 = 【生产对象的模具】。为了和普通函数区分，首字母必须大写！
    // 2. new 关键字 = 【启动模具压制对象的动作】。
    // 3. 实例对象 = 【生产出来的具体产品】。
    // =================================================================


    // ==========================================
    // 【一、 声明模具（构造函数）】
    // ==========================================
    function Goods(name, price) {
      // 这里的 this 极其有灵性：谁被 new 出来，this 就指代谁！
      this.name = name;     // 实例属性：每件商品自己的名字
      this.price = price;   // 实例属性：每件商品自己的价格
      
      this.burnMoney = function () { // 实例方法：每件商品自己都会的花钱技能
        console.log(`这款${this.name}花了 ${this.price} 元`);
      };
    }


    // ==========================================
    // 【二、 批量生产产品（实例化）】
    // ==========================================
    // 每次执行 `new`，JS 就会在内存中做 4 件事：
    // 1. 揉个空面团 {} -> 2. 连接原型链 -> 3. 把 this 指向这个面团并填入属性 -> 4. 把做好的饼干返回出来
    
    const mi = new Goods('小米手机', 1999);
    const hw = new Goods('华为手机', 3999);

    console.log('--- 产品展示 ---');
    console.log(mi); // 打印小米实例：{ name: "小米手机", price: 1999, burnMoney: f }
    console.log(hw); // 打印华为实例：{ name: "华为手机", price: 3999, burnMoney: f }


    // ==========================================
    // 【三、 验证：什么是“实例成员”（独立性）】
    // ==========================================
    console.log('--- 验证实例独立性 ---');
    
    // 1. 它们住在不同的内存地址，是两块独立的“饼干”
    console.log(mi === hw); // false 

    // 2. 改了小米的名字，华为绝对不受影响
    mi.name = '红米手机'; 
    console.log(mi.name); // '红米手机' (变了)
    console.log(hw.name); // '华为手机' (没变，依然独立)


    // ==========================================
    // 【四、 验证：什么是“静态成员”（属于模具本身）】
    // ==========================================
    console.log('--- 验证静态成员 ---');

    // 💡 静态成员：直接点在“构造函数名字”上的属性和方法。
    // 它是贴在【模具本身】上的标签，跟生产出来的【产品饼干】没有半毛钱关系！

    Goods.totalCount = 100; // 静态属性：记录全厂总库存

    Goods.showFactoryInfo = function() { // 静态方法：模具自己的介绍
      console.log('我是电子产品生产模具，日产一万件。');
    };

    // 1. 只有“模具本身”能够访问它们：
    console.log(Goods.totalCount); // 100 (成功访问)
    Goods.showFactoryInfo();        // "我是电子产品生产模具..." (成功运行)

    // 2. “产品实例”绝对访问不到：
    console.log(mi.totalCount);   // undefined ❌ (产品身上没印总库存标签)
    // mi.showFactoryInfo();       // ❌ 报错崩溃！TypeError: mi.showFactoryInfo is not a function
    
  </script>
</body>

</html>
