<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // ==========================================
    // 知识点：箭头函数 (Arrow Functions) - ES6 新增
    // 1. 概念：一种更简短的定义函数表达式的语法，特别适用于需要匿名函数（如回调函数）的场景。
    // 2. 语法简化规则：
    //    - 规则一：若“只有一个形参”，可以省略小括号 `()`。
    //    - 规则二：若函数体“只有一行代码”，可以省略大括号 `{}`，并且该行代码的结果会自动作为返回值（省略 `return` 关键字）。
    //    - 规则三：如果只有一行代码且要直接返回一个“对象字面量”，必须将对象用小括号 `()` 包裹，即 `(uname) => ({ uname: uname })`，否则 JS 引擎会把对象的 `{}` 误认作函数的代码块。
    // 3. 注意点：
    //    - 箭头函数没有自己的 arguments。
    //    - 箭头函数没有自己的 this，它的 this 是静态绑定的。
    // ==========================================

    // 【对比：传统函数表达式写法】
    // const fn = function () {
    //   console.log(123)
    // }

    // 【形式一：最基本的箭头函数语法】
    // const fn = () => {
    //   console.log(123)
    // }
    // fn()

    // 【形式二：有参数的箭头函数】
    // const fn = (x) => {
    //   console.log(x)
    // }
    // fn(1)

    // 【形式三：省略小括号（仅有一个形参时）】
    // const fn = x => {
    //   console.log(x)
    // }
    // fn(1)

    // 【形式四：省略大括号（只有一行代码时）】
    // const fn = x => console.log(x)
    // fn(1)

    // 【形式五：省略 return（只有一行代码且需要返回值时）】
    // 相当于：const fn = function(x) { return x + x; }
    // const fn = x => x + x
    // console.log(fn(1)) // 打印 2

    // 【形式六：直接返回一个对象字面量（必须用圆括号包裹）】
    // 注意下面的 `({ uname: uname })`。如果不加 `()`，JS 认为 `{ uname: ... }` 是个函数块，会报语法错误或返回 undefined。
    // const fn = (uname) => ({ uname: uname })
    // console.log(fn('刘德华')) // 打印：{ uname: "刘德华" }
  </script>
</body>

</html>
