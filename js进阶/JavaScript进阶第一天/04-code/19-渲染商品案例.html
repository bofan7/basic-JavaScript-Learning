<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品渲染</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .list {
      width: 990px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      padding-top: 100px;
    }

    .item {
      width: 240px;
      margin-left: 10px;
      padding: 20px 30px;
      transition: all .5s;
      margin-bottom: 20px;
    }

    .item:nth-child(4n) {
      margin-left: 0;
    }

    .item:hover {
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
      transform: translate3d(0, -4px, 0);
      cursor: pointer;
    }

    .item img {
      width: 100%;
    }

    .item .name {
      font-size: 18px;
      margin-bottom: 10px;
      color: #666;
    }

    .item .price {
      font-size: 22px;
      color: firebrick;
    }

    .item .price::before {
      content: "¥";
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="list">
    <!-- <div class="item">
      <img src="" alt="">
      <p class="name"></p>
      <p class="price"></p>
    </div> -->
  </div>
  <script>
    const goodsList = [
      {
        id: '4001172',
        name: '称心如意手摇咖啡磨豆机咖啡豆研磨机',
        price: '289.00',
        picture: 'https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg',
      },
      {
        id: '4001594',
        name: '日式黑陶功夫茶组双侧把茶具礼盒装',
        price: '288.00',
        picture: 'https://yanxuan-item.nosdn.127.net/3346b7b92f9563c7a7e24c7ead883f18.jpg',
      },
      {
        id: '4001009',
        name: '竹制干泡茶盘正方形沥水茶台品茶盘',
        price: '109.00',
        picture: 'https://yanxuan-item.nosdn.127.net/2d942d6bc94f1e230763e1a5a3b379e1.png',
      },
      {
        id: '4001874',
        name: '古法温酒汝瓷酒具套装白酒杯莲花温酒器',
        price: '488.00',
        picture: 'https://yanxuan-item.nosdn.127.net/44e51622800e4fceb6bee8e616da85fd.png',
      },
      {
        id: '4001649',
        name: '大师监制龙泉青瓷茶叶罐',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
      },
      {
        id: '3997185',
        name: '与众不同的口感汝瓷白酒杯套组1壶4杯',
        price: '108.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8e21c794dfd3a4e8573273ddae50bce2.jpg',
      },
      {
        id: '3997403',
        name: '手工吹制更厚实白酒杯壶套装6壶6杯',
        price: '99.00',
        picture: 'https://yanxuan-item.nosdn.127.net/af2371a65f60bce152a61fc22745ff3f.jpg',
      },
      {
        id: '3998274',
        name: '德国百年工艺高端水晶玻璃红酒杯2支装',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8896b897b3ec6639bbd1134d66b9715c.jpg',
      },
    ]

    // ==========================================
    // 实战案例：商品列表动态渲染
    // 核心步骤：
    // 1. 初始化数据：后端一般以 JSON 数组形式传递商品列表。
    // 2. 准备容器：在 HTML 中留出一个 class 为 list 的 div 用于装填商品卡片。
    // 3. 遍历拼接：
    //    - 声明一个空字符串 `str` 用来累积 HTML 代码段。
    //    - 使用 `forEach` 循环遍历商品数组。
    //    - 在遍历中，利用“对象解构”提取每个商品对象的必要属性。
    //    - 使用 ES6 模板字面量 `` 拼接商品 HTML 结构。
    // 4. 渲染上屏：
    //    - 找到容器，使用 `innerHTML` 将拼接好的长字符串一次性写入页面。
    // ⚠️性能优化提示：不要在 `forEach` 循环体内部执行 `document.querySelector().innerHTML += ...`。
    // 因为这会引发浏览器频繁的“重排 (Reflow)”与“重绘 (Repaint)”，造成性能损耗。正确的做法是像这里一样，在内存中拼接好完整的 HTML 字符串，最后一次性操作 DOM。
    // ==========================================

    // 1. 声明一个字符串变量，用于缓存拼接出来的 HTML 片段
    let str = ''
    
    // 2. 遍历商品数组
    goodsList.forEach(item => {
      // 2.1 利用对象解构提取当前商品项的 name、price 和 picture 属性
      const { name, price, picture } = item
      
      // 2.2 使用模板字符串拼接 HTML，通过 ${} 动态填充解构出来的变量
      str += `
      <div class="item">
        <img src=${picture} alt="">
        <p class="name">${name}</p>
        <p class="price">${price}</p>
      </div>
      `
    })
    
    // 3. 将最终生成的所有商品 HTML 字符串一次性添加到 class 为 list 的容器中
    document.querySelector('.list').innerHTML = str
  </script>
</body>

</html>
