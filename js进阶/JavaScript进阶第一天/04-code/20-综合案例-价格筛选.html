<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品渲染</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .list {
      width: 990px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
    }

    .item {
      width: 240px;
      margin-left: 10px;
      padding: 20px 30px;
      transition: all .5s;
      margin-bottom: 20px;
    }

    .item:nth-child(4n) {
      margin-left: 0;
    }

    .item:hover {
      box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.2);
      transform: translate3d(0, -4px, 0);
      cursor: pointer;
    }

    .item img {
      width: 100%;
    }

    .item .name {
      font-size: 18px;
      margin-bottom: 10px;
      color: #666;
    }

    .item .price {
      font-size: 22px;
      color: firebrick;
    }

    .item .price::before {
      content: "¥";
      font-size: 14px;
    }

    .filter {
      display: flex;
      width: 990px;
      margin: 0 auto;
      padding: 50px 30px;
    }

    .filter a {
      padding: 10px 20px;
      background: #f5f5f5;
      color: #666;
      text-decoration: none;
      margin-right: 20px;
    }

    .filter a:active,
    .filter a:focus {
      background: #05943c;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="filter">
    <a data-index="1" href="javascript:;">0-100元</a>
    <a data-index="2" href="javascript:;">100-300元</a>
    <a data-index="3" href="javascript:;">300元以上</a>
    <a href="javascript:;">全部区间</a>
  </div>
  <div class="list">
    <!-- <div class="item">
      <img src="" alt="">
      <p class="name"></p>
      <p class="price"></p>
    </div> -->
  </div>
  <script>
    // 2. 初始化数据
    const goodsList = [
      {
        id: '4001172',
        name: '称心如意手摇咖啡磨豆机咖啡豆研磨机',
        price: '289.00',
        picture: 'https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg',
      },
      {
        id: '4001594',
        name: '日式黑陶功夫茶组双侧把茶具礼盒装',
        price: '288.00',
        picture: 'https://yanxuan-item.nosdn.127.net/3346b7b92f9563c7a7e24c7ead883f18.jpg',
      },
      {
        id: '4001009',
        name: '竹制干泡茶盘正方形沥水茶台品茶盘',
        price: '109.00',
        picture: 'https://yanxuan-item.nosdn.127.net/2d942d6bc94f1e230763e1a5a3b379e1.png',
      },
      {
        id: '4001874',
        name: '古法温酒汝瓷酒具套装白酒杯莲花温酒器',
        price: '488.00',
        picture: 'https://yanxuan-item.nosdn.127.net/44e51622800e4fceb6bee8e616da85fd.png',
      },
      {
        id: '4001649',
        name: '大师监制龙泉青瓷茶叶罐',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
      },
      {
        id: '3997185',
        name: '与众不同的口感汝瓷白酒杯套组1壶4杯',
        price: '108.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8e21c794dfd3a4e8573273ddae50bce2.jpg',
      },
      {
        id: '3997403',
        name: '手工吹制更厚实白酒杯壶套装6壶6杯',
        price: '100.00',
        picture: 'https://yanxuan-item.nosdn.127.net/af2371a65f60bce152a61fc22745ff3f.jpg',
      },
      {
        id: '3998274',
        name: '德国百年工艺高端水晶玻璃红酒杯2支装',
        price: '139.00',
        picture: 'https://yanxuan-item.nosdn.127.net/8896b897b3ec6639bbd1134d66b9715c.jpg',
      },
    ]

    // ==========================================
    // 综合案例：商品列表渲染与价格筛选过滤
    // 本案例融合了以下核心知识点：
    // 1. 数组渲染封装：将渲染逻辑封装在 `render(arr)` 函数中，使得过滤后的数据也能复用这一渲染逻辑。
    // 2. 事件委托 (Event Delegation)：
    //    - 将点击事件绑定在父级容器 `.filter` 上，避免给每个 `<a>` 标签单独绑定事件，从而优化性能，减少内存占用。
    //    - 通过事件对象 `e.target` 获取到当前点击的子元素。
    // 3. 事件对象与自定义属性解构：
    //    - 解构 `e.target` 里的 `tagName`（用于判断点击的是否为链接）和 `dataset`（用于读取 `data-index` 自定义属性）。
    // 4. 数组过滤 (filter)：
    //    - 配合 `filter()` 方法根据价格区间动态筛选商品，并重新调用 `render()` 完成视图的局部刷新。
    // ==========================================

    // 1. 封装的渲染函数：接收一个数组，渲染到页面中
    function render(arr) {
      // 声明临时字符串
      let str = ''
      
      // 遍历传入的子数组（可以是全量数据，也可以是过滤后的数据）
      arr.forEach(item => {
        // 对象解构，提取渲染所需数据
        const { name, picture, price } = item
        str += `
         <div class="item">
          <img src=${picture} alt="">
          <p class="name">${name}</p>
          <p class="price">${price}</p>
        </div> 
        `
      })
      // 将拼装好的商品项一次性添加给容器，覆盖之前的旧商品内容
      document.querySelector('.list').innerHTML = str
    }
    
    // 页面初次打开，默认渲染全部商品
    render(goodsList)

    // 2. 价格区间过滤筛选逻辑 (使用事件委托)
    document.querySelector('.filter').addEventListener('click', e => {
      // 解构获取被点击元素的标签名 tagName 和自定义属性集合 dataset
      const { tagName, dataset } = e.target
      
      // 判断点击的是否是 A 链接（注意：标签名在原生事件中是大写的，即 'A'）
      if (tagName === 'A') {
        let arr = goodsList // 默认指向完整列表
        
        // 根据 data-index 属性值，决定过滤规则
        if (dataset.index === '1') {
          // 0-100元区间 (含 100)
          arr = goodsList.filter(item => item.price > 0 && item.price <= 100)
        } else if (dataset.index === '2') {
          // 100-300元区间 (含 100 与 300)
          arr = goodsList.filter(item => item.price >= 100 && item.price <= 300)
        } else if (dataset.index === '3') {
          // 300元以上
          arr = goodsList.filter(item => item.price >= 300)
        }
        
        // 核心步骤：用过滤后得到的新数组 `arr` 重新渲染，刷新列表视图
        render(arr)
      }
    })
  </script>
</body>

</html>
