<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // ==========================================
    // 知识点复习：Array.prototype.map() 数组映射
    // 1. 作用：遍历数组中每个元素，并根据回调函数的处理逻辑，返回一个【全新数组】。
    // 2. 核心特征：
    //    - **返回新数组**：其长度与原数组完全一样，但元素值根据 return 的返回值改变。
    //    - **不改变原数组**（纯函数操作）。
    // 3. 对比 forEach：
    //    - `forEach` 仅用于循环执行副作用（如 DOM 操作等），没有返回值。
    //    - `map` 用于加工数据并生成一个新的映射数组（常用于将数据数组映射为 HTML 模板字符串数组）。
    // ==========================================

    const arr = [1, 2, 3]
    
    // 使用 map 映射：每个元素增加 10
    const re = arr.map(item => item + 10)
    
    console.log(arr)  // 打印：[1, 2, 3] （原数组，没有受任何改动）
    console.log(re)   // 打印新生成的映射数组：[11, 12, 13]
  </script>
</body>

</html>
