<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // ==========================================
    // 知识点：Object 的常用静态方法
    // 1. 静态方法与普通方法的区别：静态方法直接挂载在 `Object` 构造器上，通过 `Object.方法名(...)` 调用，不能通过实例调用。
    // 2. 常用方法列表：
    //    - `Object.keys(obj)`：获取对象自身所有的“属性名”（键），返回一个包含键名的【数组】。
    //      * 作用：方便配合 `forEach` 等数组方法遍历对象属性。
    //    - `Object.values(obj)`：获取对象自身所有的“属性值”，返回一个包含值的【数组】。
    //    - `Object.assign(target, ...sources)`：将所有源对象（source）的属性复制到目标对象（target）中。
    //      * 作用：常用于“对象合并”和“浅拷贝对象”（克隆）。
    // ==========================================

    const o = { uname: 'pink', age: 18 }
    
    // 【一、 获取对象的键与值】
    // 1. 获得所有的属性名（返回键名数组）
    console.log(Object.keys(o))  // 打印：['uname', 'age']
    
    // 2. 获得所有的属性值（返回值数组）
    console.log(Object.values(o))  // 打印：['pink', 18]
    
    // 【二、 对象的合并与拷贝】
    // 3. 将新属性 { gender: '女' } 合并到对象 o 中
    // Object.assign(目标对象, 来源对象) -> 修改并返回目标对象
    Object.assign(o, { gender: '女' })
    console.log(o) // 打印：{ uname: 'pink', age: 18, gender: '女' }
    
    // 4. 对象浅拷贝（克隆）示例：
    // const oo = {}
    // Object.assign(oo, o) // 将 o 的所有属性复制到空对象 oo 中，oo 成为 o 的一份独立克隆
    // console.log(oo)
  </script>
</body>

</html>
