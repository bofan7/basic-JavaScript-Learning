<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .list {
      width: 990px;
      margin: 100px auto 0;
    }

    .item {
      padding: 15px;
      transition: all .5s;
      display: flex;
      border-top: 1px solid #e4e4e4;
    }

    .item:nth-child(4n) {
      margin-left: 0;
    }

    .item:hover {
      cursor: pointer;
      background-color: #f5f5f5;
    }

    .item img {
      width: 80px;
      height: 80px;
      margin-right: 10px;
    }

    .item .name {
      font-size: 18px;
      margin-right: 10px;
      color: #333;
      flex: 2;
    }

    .item .name .tag {
      display: block;
      padding: 2px;
      font-size: 12px;
      color: #999;
    }

    .item .price,
    .item .sub-total {
      font-size: 18px;
      color: firebrick;
      flex: 1;
    }

    .item .price::before,
    .item .sub-total::before,
    .amount::before {
      content: "¥";
      font-size: 12px;
    }

    .item .spec {
      flex: 2;
      color: #888;
      font-size: 14px;
    }

    .item .count {
      flex: 1;
      color: #aaa;
    }

    .total {
      width: 990px;
      margin: 0 auto;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid #e4e4e4;
      padding: 20px;
    }

    .total .amount {
      font-size: 18px;
      color: firebrick;
      font-weight: bold;
      margin-right: 50px;
    }
  </style>
</head>

<body>
  <div class="list">
    <!-- <div class="item">
      <img src="https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg" alt="">
      <p class="name">称心如意手摇咖啡磨豆机咖啡豆研磨机 <span class="tag">【赠品】10优惠券</span></p>
      <p class="spec">白色/10寸</p>
      <p class="price">289.90</p>
      <p class="count">x2</p>
      <p class="sub-total">579.80</p>
    </div> -->
  </div>
  <div class="total">
    <div>合计：<span class="amount">1000.00</span></div>
  </div>
  <script>
    const goodsList = [
      {
        id: '4001172',
        name: '称心如意手摇咖啡磨豆机咖啡豆研磨机',
        price: 289.9,
        picture: 'https://yanxuan-item.nosdn.127.net/84a59ff9c58a77032564e61f716846d6.jpg',
        count: 2,
        spec: { color: '白色' }
      },
      {
        id: '4001009',
        name: '竹制干泡茶盘正方形沥水茶台品茶盘',
        price: 109.8,
        picture: 'https://yanxuan-item.nosdn.127.net/2d942d6bc94f1e230763e1a5a3b379e1.png',
        count: 3,
        spec: { size: '40cm*40cm', color: '黑色' }
      },
      {
        id: '4001874',
        name: '古法温酒汝瓷酒具套装白酒杯莲花温酒器',
        price: 488,
        picture: 'https://yanxuan-item.nosdn.127.net/44e51622800e4fceb6bee8e616da85fd.png',
        count: 1,
        spec: { color: '青色', sum: '一大四小' }
      },
      {
        id: '4001649',
        name: '大师监制龙泉青瓷茶叶罐',
        price: 139,
        picture: 'https://yanxuan-item.nosdn.127.net/4356c9fc150753775fe56b465314f1eb.png',
        count: 1,
        spec: { size: '小号', color: '紫色' },
        gift: '50g茶叶,清洗球,宝马, 奔驰'
      }
    ]

    // ==========================================
    // 综合案例：购物车商品列表渲染与结算合计
    // 本案例综合运用了以下重点技术：
    // 1. 商品列表渲染 (map + join)：
    //    - 使用 `map()` 遍历 goodsList，将每个对象转换成对应的 HTML 卡片字符串。
    //    - 用 `join('')` 合并为长字符串一次性写入 `.list` 容器的 innerHTML。
    // 2. 对象解构：快速取出商品基本信息。
    // 3. 规格文本转换 (Object.values + join)：
    //    - 规格 `spec` 是个对象（如 `{ size: '40cm*40cm', color: '黑色' }`）。
    //    - 提取属性值并用 `/` 拼接成展示文本。
    // 4. 浮点数计算精度问题规避：
    //    - ⚠️在 JS 中直接做浮点数乘法可能有精度误差（例如 `0.1 * 0.2 = 0.020000000000000004`）。
    //    - 解决方案：先将单价乘以 100 变成整数，再乘以数量，最后除以 100，确保金额计算精准无误。
    // 5. 赠品逻辑条件判定 (三元运算符 & 链式调用)：
    //    - 只有部分商品有 `gift` 属性。
    //    - 如果有 `gift`，以逗号拆分成数组，把每个赠品包装在 span 里，最后拼接；没有则返回空字符串。
    // 6. 购物车总价计算 (reduce)：
    //    - 运用 `reduce()` 方法累加每件商品的小计金额，起始值设为 0。
    // ==========================================

    // 1. 根据数据渲染页面商品列表
    document.querySelector('.list').innerHTML = goodsList.map(item => {
      // 1.1 对象解构，提取商品的各项信息
      const { picture, name, count, price, spec, gift } = item
      
      // 1.2 将规格对象的所有属性值提出来，用 '/' 连接成一个字符串（如 "小号/紫色"）
      const text = Object.values(spec).join('/')
      
      // 1.3 计算商品小计（单价 * 数量），并保留两位小数
      // 乘以 100 转换为整数计算，防止 JS 浮点数计算精度丢失，计算完毕后再除以 100 还原，最后用 toFixed(2) 格式化成 2 位小数的字符串
      const subTotal = ((price * 100 * count) / 100).toFixed(2)
      
      // 1.4 处理赠品模块：使用三元运算符判断商品是否有 gift 字段
      // 如果有，则用 split(',') 拆分为数组，遍历 map 生成 span 赠品标签，再用 join('') 拼接成 HTML。若没有，直接赋为空字符串 ''
      const str = gift ? gift.split(',').map(giftItem => `<span class="tag">【赠品】${giftItem}</span> `).join('') : ''
      
      // 1.5 返回拼装好的当前商品的 HTML 模板字符串
      return `
        <div class="item">
          <img src=${picture} alt="">
          <p class="name">${name} ${str} </p>
          <p class="spec">${text} </p>
          <p class="price">${price.toFixed(2)}</p>
          <p class="count">x${count}</p>
          <p class="sub-total">${subTotal}</p>
        </div>
      `
    }).join('') // 将生成的 HTML 数组合并为一整个大字符串，设置给 container.innerHTML

    // 2. 购物车合计总价计算
    // 使用 reduce 累计所有商品的（价格 * 数量），设置初始累加值 0 极其关键
    const total = goodsList.reduce((prev, item) => prev + (item.price * 100 * item.count) / 100, 0)
    
    // 将总金额格式化为 2 位小数，写入合计 span 中
    document.querySelector('.amount').innerHTML = total.toFixed(2)
  </script>
</body>

</html>
