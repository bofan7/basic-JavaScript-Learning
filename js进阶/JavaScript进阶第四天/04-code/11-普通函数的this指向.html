<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>点击</button>
  <script>
    // ==========================================
    // 知识点：普通函数中的 this 指向规则
    // 1. 核心判断标准：“谁调用该函数，this 就指向谁”。
    // 2. 常见场景划分：
    //    - 规则一：全局环境下，或在全局直接调用普通函数（如 `fn()`）时，`this` 指向全局对象 `window`（在严格模式 'use strict' 下指向 `undefined`）。
    //    - 规则二：定时器/延时器（setTimeout / setInterval）的普通回调函数中，`this` 指向 `window`。
    //    - 规则三：DOM 事件回调函数中，如果使用的是普通函数，`this` 指向绑定该事件的【DOM 元素】本身。
    //    - 规则四：对象的方法被调用时（如 `obj.sayHi()`），方法内部的 `this` 指向该【对象自身】。
    //    - 规则五：构造函数内部，`this` 指向通过 new 创建出来的【实例对象】。
    // ==========================================

    // 【场景一：全局作用域中】
    console.log(this)  // 打印：window
    
    // 【场景二：全局直接调用普通函数】
    function fn() {
      console.log(this)  // 打印：window。相当于 window.fn()  
    }
    window.fn()
    
    // 【场景三：setTimeout 延时器普通回调函数】
    window.setTimeout(function () {
      console.log(this) // 打印：window。因为是浏览器定时器线程在全局调用的这个函数
    }, 1000)
    
    // 【场景四：DOM 事件监听普通函数】
    document.querySelector('button').addEventListener('click', function () {
      console.log(this)  // 打印：button 元素对象。因为事件是由 button 触发并处理的
    })
    
    // 【场景五：对象方法调用】
    const obj = {
      sayHi: function () {
        console.log(this)  // 打印：obj 对象。因为是通过 obj.sayHi() 调用的
      }
    }
    obj.sayHi()
  </script>
</body>

</html>
